name: Build APK

on:
  push:
    branches: [ main ]
    # a push with only the APK (the "APK da versão N" commit) does not start a new build
    paths-ignore:
      - RacePocket.apk
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Cadastre os segredos KEYSTORE_BASE64 e KEYSTORE_PASSWORD em Settings > Secrets and variables > Actions"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/racepocket.jks"

      - name: Build
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/racepocket.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/racepocket.jks"

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk RacePocket-${{ github.run_number }}.apk
          cp app/build/outputs/apk/release/app-release.apk RacePocket.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RacePocket-${{ github.run_number }}
          path: RacePocket-${{ github.run_number }}.apk

      # The app checks this release to update itself.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: RacePocket ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: RacePocket.apk
